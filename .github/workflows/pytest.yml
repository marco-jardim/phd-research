name: Testes Python (pytest)

on:
  push:
    branches: [main, pos-qualificacao, pq/revisao-2-redacao]
  pull_request:
    branches: [main, pos-qualificacao, pq/revisao-2-redacao]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (testes portaveis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PHD_RESEARCH_DATA_ROOT: /__phd_research_private_data_unavailable__

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group ci

      - name: Run tests
        run: python -m pytest tests -q -rs

      - name: Portao de fidelidade (base pre-revisao-2, alvo HEAD)
        run: |
          # fetch-depth: 0 já traz o histórico e as tags; --tags garante pre-revisao-2.
          git fetch --tags --force
          git rev-parse --verify pre-revisao-2^{commit}
          python scripts/portao_fidelidade.py --base pre-revisao-2 --alvo HEAD || {
            status=$?
            cat .local/fidelidade/relatorio.md || true
            exit $status
          }
