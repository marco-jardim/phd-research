[project]
name = "phd-research"
version = "0.0.0"
description = "Research notebooks for SIM x SINAN-TB comparison"
requires-python = ">=3.11"
readme = "README.md"

# Minimal runtime dependencies to execute the notebooks.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "imbalanced-learn>=0.12",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "jupyterlab>=4.0",
  "ipykernel>=6.0",
  "papermill>=2.6",
  "nbconvert>=7.0",
  "jupyter>=1.0",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "pyyaml>=6.0",
  "joblib>=1.3",
  "statsmodels>=0.14",
  "requests>=2.31",
  "httpx>=0.27",
  "anthropic>=0.40",
  "gzcmd-record-linkage==0.4.0",
]

[dependency-groups]
# Portable tests only; versions match the local Python 3.13 environment.
# scikit-learn and xgboost also match prereg_robustez_arranjo.yaml.
ci = [
  "scikit-learn==1.8.0",
  "xgboost==3.2.0",
  "pandas==3.0.1",
  "numpy==2.4.2",
  "scipy==1.17.1",
  "statsmodels==0.15.0",
  "pyyaml==6.0.3",
  "pytest==9.0.3",
  "matplotlib==3.10.8",
  "anthropic==0.105.2",
  "requests==2.34.2",
  "gzcmd-record-linkage==0.4.0",
  "python-dotenv==1.2.2",
  "httpx==0.28.1",
  "joblib==1.5.3",
  "psutil==7.2.2",
  "threadpoolctl==3.6.0",
  "imbalanced-learn==0.14.2",
  "PyMuPDF==1.27.2.3",
  "modal==1.3.3",
  "PyAutoGUI==0.9.54",
  "RapidFuzz==3.14.5",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
# A caller's `-q` must still print the "N passed" verification summary.
addopts = ""
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  # Exceção temporária autorizada pela autora em 2026-11-10 (ver tests/conftest.py).
  "deck_qualificacao: confere o conteúdo do deck da qualificação (text/slides/); pulado salvo com DECK_QUALIFICACAO=1",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
