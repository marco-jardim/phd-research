# Alertas do portão de fidelidade (scripts/portao_fidelidade.py) reconhecidos pela autora.
#
# Cada entrada aceita UM alerta, identificado por arquivo + hash do parágrafo novo:
#
#   - arquivo: text/latex/estudo4_gzcmd.tex     # caminho relativo à raiz, com "/"
#     hash_paragrafo_novo: "0123456789abcdef"   # sha256 do parágrafo normalizado (espaços
#                                               # colapsados, sem comentários), 16 primeiros
#                                               # hexadecimais; aparece como "Hash" no relatório.
#                                               # Sempre entre aspas (hash só com dígitos viraria
#                                               # número no YAML). Para parágrafo removido, use o
#                                               # hash do parágrafo da base.
#     itens:                                    # obrigatório e não vazio; itens aceitos, no formato
#       - numeros:-39.3                         # do JSON (categoria:sinal+valor; "-" removido,
#       - citacoes:+silva2020                   # "+" adicionado). Tabela gerada: tabela_gerada:<estado>.
#     justificativa: "Número corrigido conforme data/x.csv."
#     autora_aprovou: true                      # só "true" suprime o alerta
#
# Reeditar o parágrafo muda o hash e invalida o aceite (aparece como "sem correspondência").
# Formato plano: o analisador interno aceita escalares, listas inline ([a, b]) e listas em bloco.
#
# Modo do portão (--modo, padrão `auto`): arquivo listado em tests/data/arquivos_revisados.yaml
# é comparado só por capítulo (números por arquivo; o sentido já é protegido pelas âncoras do
# registro de invariantes e pela revisão de fidelidade independente, e a comparação por
# parágrafo só gera ruído de fusão e remoção); arquivo não listado segue em `ambos` (parágrafo
# e capítulo). Nos arquivos revisados, só a seção `aceites_numeros` vale; entradas de `aceites`
# para eles não casam com nada. `--modo capitulo|paragrafo|ambos` forçam um modo para todos.
# Na comparação por capítulo, números de rótulo (passo, capítulo, seção, figura, tabela,
# equação, estudo, objetivo, meta) são isentos, e um número é coberto quando é o texto_pt de
# qualquer valor exigido por ocorrência do registro que cite o arquivo.
#
# Comparação por capítulo (--modo auto|capitulo|ambos): a seção `aceites_numeros` libera, por
# arquivo, um número novo, mais frequente ou removido que o portão bloquearia:
#
#   - arquivo: text/latex/estudo4_gzcmd.tex     # caminho relativo à raiz, com "/"
#     numero: "39,3"                            # um só número, entre aspas (pt-BR ou en)
#     autora_aprovou: true                      # só "true" libera
#     motivo: "Número novo conferido em data/x.csv."

aceites: []

aceites_numeros: []
