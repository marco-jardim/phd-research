  - arquivo: text/latex/apendice_ablacao.tex
    hash_paragrafo_novo: "c3ee160acd1f6d3a"
    itens:
      - negadores:-não
    justificativa: "Revisão 2 (auditoria texto x tabela x figura de 2026-11-09, pedido da autora): correção conferida no artefato de origem (arredondamento a partir das contagens exatas ou do valor completo, casas decimais uniformes, nomes e notas que descrevem a tabela, fontes corretas); números alterados conferidos contra data/ e contra HEAD"
