# Conceitos e variantes para o levantamento de termos consagrados
# (scripts/termos_consagrados.py).
#
# Estrutura de cada item:
#   conceito:  rótulo curto do conceito (único)
#   variantes: lista de {forma, lingua}; lingua é "pt" ou "en"
#   guia:      (opcional) forma que o guia de estilo adota hoje, para comparação
#   notas:     (opcional) observação para o resumo
#
# Regras de casamento (ver o script): sem diferença de maiúsculas/minúsculas,
# sem diferença de acentos, hífen equivale a espaço, plural tolerado, limite de
# palavra, frase mais longa primeiro. Formas escritas só em maiúsculas (VPP, F1,
# PPV) são comparadas com distinção de maiúsculas.
#
# Origem: docs/support_text/STYLE_PROMPT_escrita_academica.md (seções 3.1 a 3.5),
# text/latex/glossario.tex e text/latex/siglas.tex.

