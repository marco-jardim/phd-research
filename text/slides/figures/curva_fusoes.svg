<svg xmlns="http://www.w3.org/2000/svg" class="figura figura-curva_fusoes" viewBox="0 0 1000 440" width="100%" role="img" aria-labelledby="curva_fusoes-titulo curva_fusoes-desc" font-family="inherit">
<title id="curva_fusoes-titulo">Pares verdadeiros recuperados abaixo do corte, revisor perfeito</title>
<desc id="curva_fusoes-desc">Curvas em degrau do número de pares verdadeiros recuperados abaixo do corte, de 0 a 36, conforme as revisões humanas, de 1 a 2.522 em escala logarítmica, para as ordenações O1 (escore do OpenRecLink), O3 (probabilidade calibrada fora da amostra), F3 (fusão de O3, O1 e O3 com MACD) e F4 (fusão de O3 e O1), com revisor perfeito. Com 96 revisões, O1 recupera 19, O3 22, F3 25 e F4 18.</desc>
