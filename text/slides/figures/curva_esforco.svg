<svg xmlns="http://www.w3.org/2000/svg" class="figura figura-curva_esforco" viewBox="0 0 1000 440" width="100%" role="img" aria-labelledby="curva_esforco-titulo curva_esforco-desc" font-family="inherit">
<title id="curva_esforco-titulo">Pares verdadeiros recuperados abaixo do corte, revisor perfeito</title>
<desc id="curva_esforco-desc">Curvas em degrau do número de pares verdadeiros recuperados abaixo do corte, de 0 a 36, conforme as revisões humanas, de 1 a 2.522 em escala logarítmica, para as ordenações O1 (escore do OpenRecLink), O2 (nota final do CdR), O3 (probabilidade calibrada fora da amostra) e O4 (probabilidade recalibrada de ASR), com revisor perfeito. Dois pontos marcam o arranjo ASR: vigilância, 23 pares verdadeiros com 96 revisões, 21 falsos positivos e 344 pares avaliados pelo LLM; confirmação, 9 pares verdadeiros com 17 revisões, 4 falsos positivos e 41 pares avaliados pelo LLM.</desc>
