<svg xmlns="http://www.w3.org/2000/svg" class="figura figura-incerteza_ordenacoes" viewBox="0 0 1000 290" width="100%" role="img" aria-labelledby="incerteza_ordenacoes-titulo incerteza_ordenacoes-desc" font-family="inherit">
<title id="incerteza_ordenacoes-titulo">Diferença de revisões frente a O1, por meta de pares verdadeiros</title>
<desc id="incerteza_ordenacoes-desc">Três painéis, um por meta de pares verdadeiros recuperados abaixo do corte, com a mediana e o intervalo de confiança de 95% da diferença de revisões humanas de O3, F3 e F4 frente a O1; valores negativos indicam menos revisões que O1. Marcador cheio quando o intervalo inteiro fica abaixo de zero. Meta de 9 pares verdadeiros: O3, mediana −21, IC 95% de −52 a 13 (marcador vazado); F3, mediana −35, IC 95% de −59 a −14 (marcador cheio); F4, mediana −38, IC 95% de −61 a −18 (marcador cheio). Meta de 23 pares verdadeiros: O3, mediana −175, IC 95% de −1.006 a 327 (marcador vazado); F3, mediana −328, IC 95% de −1.041 a 6 (marcador vazado); F4, mediana −274, IC 95% de −995 a 40 (marcador vazado). Meta de 36 pares verdadeiros: O3, mediana 580, IC 95% de −1.962 a 23.566 (marcador vazado); F3, mediana −894, IC 95% de −2.243 a −164 (marcador cheio); F4, mediana −1.203, IC 95% de −2.049 a −63 (marcador cheio).</desc>
