# Manifesto das tabelas incluídas pela árvore de text/latex/tese.tex.
# Verificado por tests/test_tabelas_tese.py. Tabelas ficam fora da reescrita por LLM
# (scripts/reescrita_marcadores.py recusa mascarar arquivos de text/latex/tables/) e só
# mudam quando o gerador muda.
#
# Campos:
#   arquivo   caminho relativo a text/latex/tables/.
#   protecao  regeneracao | sha256.
#   regeneracao: o teste regenera a tabela inteira e compara com o arquivo versionado.
#     teste     arquivo de teste, com nó opcional: "test_x.py::test_nome" (relativo a tests/).
#     gerador   (opcional) módulo de scripts/ que o teste importa; obrigatório quando o teste
#               não cita o nome da tabela (regeneração em laço sobre os arquivos gerados).
#   sha256: sem teste que compare a tabela inteira. Hash do conteúdo com quebras de linha
#     normalizadas para LF.
#     sha256    hash atual.
#     motivo    por que não há regeneração (à mão, ou gerador sem teste).
#   Quando o hash diverge, a tabela mudou sem gerador: a autora precisa aprovar a mudança e
#   atualizar o hash aqui.

