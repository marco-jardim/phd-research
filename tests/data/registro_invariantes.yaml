- id: C03r
  descricao: "Cautela transversal: a referência operacional resulta do corte do OpenRecLink e da revisão manual de origem, feita por revisora única, com ordem, fontes e parada não documentadas; a disponibilidade das evidências do CdR à revisora é hipótese de trabalho. Os 36 pares verdadeiros abaixo do corte estão entre os 2.522 potenciais pares de maior escore (favoreceria O1); a incorporação das evidências do CdR favoreceria O2 a O4. Sem suposições sobre o mecanismo de verificação, a direção dominante e a magnitude do viés não são identificáveis. Números em N09"
