- id: C14
  descricao: "Resultado: a dificuldade da grey area e a disparidade concentram-se no passo 11, que reúne 25 dos 36 pares verdadeiros abaixo do corte: sensibilidade automática de P na vigilância 42,5% contra 95,0% e 96,1% nos passos 6 e 9, disparidade herdada do corte; com revisor perfeito nos encaminhamentos o limite seria 77,5%. Ressalva: passo é estrato de processo, não atributo demográfico; raça/cor ausente do extrato. Números em N07, N30 e N43"
