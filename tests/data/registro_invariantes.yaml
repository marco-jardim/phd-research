# Registro de invariantes da tese (números centrais N01-N39 e afirmações C01-C09).
#
# Verificado por scripts/registro_invariantes.py e tests/test_registro_invariantes.py.
# Duas verificações independentes:
#   1. artefato: cada item de `valores` é recalculado a partir do CSV/JSON de origem,
#      formatado em pt-BR (vírgula decimal, ponto de milhar) e comparado com `texto_pt`
#      (e `texto_en`, no formato inglês, usado no Abstract);
#   2. texto: cada item de `ocorrencias` exige que exista ao menos um parágrafo (blocos
#      separados por linha em branco; comentários LaTeX removidos) do arquivo, ou da seção
#      indicada, contendo TODOS os tokens exigidos. Nenhuma frase é fixada: só âncoras
#      (números e termos técnicos estáveis).
#
# Esquema:
#   - id: N10                       # N## = número; C## = afirmação
#     descricao: "..."
#     tipo: numero                  # numero | afirmacao
#     valores:                      # uma ou mais grandezas conferidas em conjunto
#       - nome: aceitos_P_vig       # único em todo o registro (pode ser usado em qualquer entrada)
#         fonte:                    # uma das formas abaixo
#           arquivo: data/x.csv     #   CSV: filtro (colunas = valores; deve casar 1 linha),
#           filtro: {modo: vigilancia}   #   coluna, agregar (unico|soma|contagem)
#           coluna: aceitos
#           # arquivo: x.json, chave: "faixa.operational_n"   JSON por chave pontilhada
#           # derivado: "n_par0 / n_vinculos", formato: "1:{:.0f}"   aritmética sobre outros
#           #   valores nomeados (sem eval; também wilson_inf(k, n), wilson_sup(k, n), abs/min/max)
#         transformacao: null       # int | decN (N casas) | pctN (x100, N casas); prefixo abs_
#         texto_pt: "215"           # como deve aparecer no texto em português
#         texto_en: "215"           # opcional: formato inglês (padrão: separadores trocados)
#         auxiliar: false           # opcional: sem texto_pt, não usável como token
#     ocorrencias:                  # âncoras de conceito, não frases
#       - {arquivo: text/latex/tese.tex, secao: resumo, exige: [aceitos_P_vig, "247"]}
#         # secao: resumo | abstract (apenas tese.tex); abstract usa texto_en dos valores.
#         # `exige`: lista de tokens, todos no mesmo parágrafo. Nome de valor expande para
#         #   texto_pt/texto_en; texto literal vale como está; sublista = qualquer uma (OU).
#         # `exige_todos` / `exige_algum`: para afirmações (sem diferenciar caixa nem acento).
#         # `xfail: "..."`: inconsistência real do texto documentada; o caso é esperado
#         #   falhar (estrito: se passar, remova o marcador).
#     ressalvas: "..."              # opcional
#     pendente: "..."               # opcional: o que falta de fonte
#
# Convenções: tokens não incluem terminologia sujeita a revisão ("revisão clerical",
# "vínculo" etc.); ancoram-se em números e termos técnicos (P, O3, PAR, k=96, LLM, NONMATCH).
# Afirmações (C01-C09): as ocorrências ancoram-se na polaridade e em símbolos/termos
# técnicos, com variantes de lema em sublistas (alternativas, qualquer uma) de
# `exige_todos` ou em `exige_algum`; nenhuma frase inteira é fixada. Uma reescrita
# legítima continua passando; a inversão de polaridade (ex.: "aceita" no lugar de "não
# deve aceitar") falha.
#
# ATENÇÃO: alterar qualquer `exige`, `exige_todos`, `exige_algum` ou `texto_*` deste
# arquivo exige aprovação da autora. Cada entrada alterada leva, antes de `ocorrencias`,
# a linha de comentário `# aprovado_por_autora: <data>` (AAAA-MM-DD, data da aprovação).
# Sem a linha, a alteração não foi aprovada.
#
# Abreviações dos arquivos nos comentários: T=tese.tex, C1/C3=capitulo1/3, CC=conclusao,
# ED=capitulo_dados, E4/E5=estudo4_gzcmd/estudo5_equidade, SL=slides/defesa.tex,
# RO=slides/roteiro_defesa.md. Linhas citadas são da tag pre-revisao-2.
#
# Inconsistências documentadas via xfail: I3 (limiar global arredondado), I5 (H=22 de
# uma réplica sem qualificador), I6 (29 revisões da confirmação sem separar os 12 MATCH).

# ---------------------------------------------------------------- números

