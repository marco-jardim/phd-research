- id: C05r
  descricao: "Cautela acoplada aos Estudos 2 e 3: os resultados dos estudos de classificadores e de estratégias são otimistas por três razões (indicadores de encerramento por óbito, que são vazamento de alvo; partição por linha; limiares escolhidos no teste). No controle 2x2 do Random Forest com SMOTE a partição por óbito reduziu o F1 de 0,931 para 0,846 e a retirada dos indicadores pouco o alterou; esses estudos não fundamentam a adoção dos pipelines, e o GZ-CMD e o arranjo P não usam os indicadores. Números em N39"
