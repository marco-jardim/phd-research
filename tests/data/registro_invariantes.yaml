  descricao: "Resultado: na análise exploratória posterior ao registro, as fusões F3 e F4 reduziram as revisões frente a O1 nas metas de 9 e 36 pares verdadeiros, com IC 95% por bootstrap agrupado por óbito inteiramente abaixo de zero (F4: medianas de 38 e 1.203 revisões a menos; F3: 35 e 894), mas não na meta de 23; F4 recuperou os 36 com 1.387 revisões contra 2.521 de O1. Ressalvas acopladas: frente a O3 nenhum IC fica abaixo de zero; com 96 revisões F3 recupera 25, F4 18, O1 19 e O3 22; as fusões vêm de análise posterior ao registro, entre variantes. Números em N22, N26, N42 e N44"
