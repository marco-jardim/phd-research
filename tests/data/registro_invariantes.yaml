- id: C13
  descricao: "Resultado: na vigilância P aceitou automaticamente 4 dos 36 pares verdadeiros abaixo do corte, todos pelo LLM, com 21 falsos positivos (VPP 16,0%) e encaminhou 96 potenciais pares ao revisor humano; encaminhando também os MATCH do LLM, P recuperaria 23 com 121 revisões e O3, 23 com 125; na confirmação O2 recuperou os mesmos 9 com 11 revisões contra 17. Nas condições avaliadas o LLM não deve aceitar vínculos sozinho; usos subordinados ao revisor humano são hipóteses exploratórias. Ressalvas acopladas: registro interno de P anterior à avaliação, sem critério de sucesso, leitura como resultado negativo posterior; revisor perfeito simulado. Números em N13, N15, N16, N18 e N19"
