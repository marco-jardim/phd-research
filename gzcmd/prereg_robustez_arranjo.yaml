approved_design: "# Desenho da análise de robustez do arranjo (aprovado pelo autor\
  \ em 2026-11-05)\n\nOrigem: sessão do architect `ses_e55bd50fbffeqJ3D0ecptTEgzf`,\
  \ aprovada pelo verificador e pelo autor. O orçamento aprovado cobre a grade completa.\
  \ Teto de segurança contra defeito: 2.000 pares novos (cerca de US$ 6,30); acima\
  \ disso, parar e consultar. Base: `893a2bb` (branch `pq/arranjo-corte`).\n\n## (a)\
  \ Pergunta e limites\nCom o mesmo extrato, os mesmos rótulos, custos e respostas,\
  \ a pergunta é se se mantêm, ao variar a semente do XGBoost e `n_jobs` (bloco N)\
  \ e a semente dos folds REFREC (bloco P):\n- a dominância de Pareto fraca de P-Platt\
  \ sobre P, por modo;\n- as diferenças nos 36 vínculos com PAR=2.\n\nO que a análise\
  \ não responde:\n- não confirma P-Platt;\n- não mede generalização nem variabilidade\
  \ amostral;\n- não cobre a estocasticidade do LLM (uma resposta por par, em cache);\n\
  - não trata os vieses do padrão-ouro;\n- não perturba a cascata nem o comparador\
  \ a posteriori.\n\nP continua sendo o braço principal registrado.\n\n## (b) Grade\
  \ (40 treinos 5×5, um fator por vez)\n- **R0:** fold_seed 42, xgb_seed 42, n_jobs\
  \ 8. É gate: tem de reproduzir S1/S3 exatamente.\n- **Bloco N:** fold_seed 42; xgb_seed\
  \ em {42, 101, 102, …, 109}; n_jobs em {8, 2}. São 20 réplicas, incluindo R0, na\
  \ ordem listada.\n- **Bloco P:** xgb_seed 42; n_jobs 8; fold_seed em {1000, 1010,\
  \ …, 1190}. São 20 réplicas, na ordem listada.\n- **Braços:** P e P-Platt (`include_a3=False`).\
  \ B1 entra só no gate de R0.\n\n## (c) Parâmetros fixos\nFicam como no pré-registro\
  \ pai: extrato, partição 211/61.485/36, cortes, custos, orçamentos, bandas, guardas\
  \ v3.1, os 30 atributos, o esquema 5×5 REFREC, os hiperparâmetros (exceto random_state\
  \ e n_jobs), a isotônica e o Platt com os alvos da emenda 1, o fallback com menos\
  \ de 10 PAR=2, o estimador M3 e as três coortes congeladas, o prompt v4 `0693f4a8…`,\
  \ `claude-haiku-5-5`, o dossiê sem os seis model_outputs e a chave de cache.\n\n\
  Versões: sklearn 1.8.0 e xgboost 3.2.0. Se divergirem, abortar.\n\nTaxas do revisor:\
  \ recalculadas em cada réplica, só com as três coortes congeladas, nunca com respostas\
  \ de S2, do suplemento ou da robustez. No bloco N, a partição não muda, então as\
  \ taxas têm de ser iguais a `data/arranjo_corte_taxas_crossfit.csv` (sha256 `d0876836…`;\
  \ gate).\n\n## (d) Desfechos por réplica × modo × braço\nNa base inteira, com [5,9)\
  \ como desfecho secundário:\n- aceitos, FP (abaixo do corte), perdidos, potenciais\
  \ pares ao humano, vínculos ao humano, pares e chamadas do LLM, custo;\n- partição\
  \ dos 36 PAR=2;\n- VPP do LLM abaixo do corte (MATCH do LLM com y=1 sobre o total\
  \ de MATCH do LLM), calculado diretamente;\n- diferenças pareadas P − P-Platt.\n\
  \nEstabilidade sem rótulo:\n- número de pares com |Δp| > 1e-14 e Δp máximo em relação\
  \ a R0;\n- proporção de pares abaixo do corte que mudam de ação;\n- Jaccard dos\
  \ conjuntos LLM_REVIEW;\n- folds com fallback.\n\n## (e) Resumos por bloco × modo\n\
  - distribuição completa em CSV, mediana, mínimo, máximo e IQR;\n- proporção de diferenças\
  \ >0, =0 e <0;\n- proporção de réplicas em que P-Platt domina P, com Clopper-Pearson\
  \ descritivo;\n- dominância inversa;\n- PAR=2: proporção em que P-Platt aceita pelo\
  \ menos tanto quanto P, e em que cada braço perde mais que o a posteriori fixo (9\
  \ na vigilância e 17 na confirmação).\n\n## (f) Critérios, fixados antes, por modo,\
  \ sem agregar modos\n- **Dominância:** Pareto fraca no vetor (aceitos ↑, FP ↓, perdidos\
  \ ↓, pares ao humano ↓, pares ao LLM ↓), com tolerância 0 e pelo menos uma desigualdade\
  \ estrita.\n- **Estável:** dominância em ≥90% das réplicas válidas nos DOIS blocos\
  \ (≥18/20 em cada) e dominância inversa em ≤5%.\n- **Não sustentada:** dominância\
  \ em <50% nos dois blocos, ou dominância inversa em ≥10% em algum bloco.\n- **Mista:**\
  \ qualquer outro caso.\n- **Critério secundário (vigilância):** diferença de FP\
  \ >0 em ≥90% de cada bloco.\n- **Réplicas inválidas:** ficam no denominador como\
  \ \"não domina\".\n\nNa confirmação, a dominância de R0 depende de 1 FP e 1 encaminhamento.\
  \ A conclusão da vigilância não se estende a ela.\n\n## (g)(h) LLM e fases\nO dossiê\
  \ não depende de p. O pool conhecido tem 1.850 pares na vigilância (1.774 + 10 +\
  \ 66) e 476 na confirmação (459 + 14 + 3).\n\n- **Fase A, sem API e sem métricas\
  \ com rótulo:**\n  - treina as 40 réplicas e grava as probabilidades por par só\
  \ em `.local/arranjo_robustez/`;\n  - recalcula as taxas e roda a triagem;\n  -\
  \ versiona só contagens de modo × braço × banda × ação × réplica;\n  - monta a fila\
  \ única por modo: união de P∪P-Platt em todas as réplicas, menos o pool;\n  - confere\
  \ o cache com `cache_matches` e, onde existir, com `identity.json`, inclusive para\
  \ S2, suplemento e robustez. Hoje `s2_suplementar.responses` não confere o hash\
  \ do dossiê: corrigir com um teste.\n- **Regra de parada (decisão do autor):** o\
  \ orçamento cobre a grade completa, sem truncar. Teto de segurança: mais de 2.000\
  \ pares novos ou mais de US$ 6,50 só na robustez obriga a parar e consultar. Custo\
  \ estimado de US$ 0,00316404 por par (1,2 × (6.847 × 0,10 + 3.904 × 0,50)/10⁶).\n\
  - **Fase B:**\n  - grava a nota de execução com o sha256 da fila; commit e push\
  \ ANTES de chamar a API;\n  - `run_mode` com OUT `data/sprint3b/anthropic_sem_mo_v4_arranjo_robustez`,\
  \ no padrão do suplemento;\n  - modos em sequência, no máximo 4 workers;\n  - aceita\
  \ só `complete: true`, zero erros e auditoria de segredos com zero ocorrências;\n\
  \  - respostas novas nunca reestimam taxas.\n- **Fase C:** avaliação com rótulos.\n\
  \n## (i) Recursos\n- Um processo filho por réplica, sequencial (Start-Process com\
  \ espera explícita), sem joblib.\n- Antes de cada réplica: com menos de 6 GiB livres,\
  \ limpar loky órfãos; com menos de 3 GiB, parar.\n- Checkpoint por réplica (.npz\
  \ e .json de identidade: sementes, n_jobs, hashes, versões), com `os.replace` e\
  \ backoff; na retomada, recalcular a réplica se a identidade divergir.\n- Medir\
  \ R0 e (42, n_jobs 2) com `perf_counter`. Se a projeção passar de 8 h, consultar.\n\
  \n## (j) Implementação\n- **`gzcmd/arranjo_robustez.py` (novo):**\n  - `replica_factory(xgb_seed,\
  \ n_jobs)`, que retorna `lambda y, _seed: _classifier(y, xgb_seed).set_params(n_jobs=n_jobs)`;\n\
  \  - `run_replica` com `nested_cutoff_probabilities(seed=fold_seed, model_factory=...,\
  \ include_a3=False)`;\n  - `dominates`, os resumos, Clopper-Pearson e um `verify_prereg`\
  \ genérico.\n- **`scripts/arranjo_robustez.py`:** subcomandos `--preregister`, `fase-a`,\
  \ `preparar-llm`, `fase-b` e `fase-c`.\n  - Reusa de `s1_simular`: `load_raw`, `cohort_sources`,\
  \ `validated_responses`, `apply_guardrails` e `build_engine_from_config`.\n  - Reusa\
  \ de `s3_avaliar`: `replay`, `metrics` e `par2_metrics`; e também `pending_cost`\
  \ e `run_mode`.\n- **Gates de R0:**\n  - P e P-Platt iguais a `.local/arranjo_corte/oof.npz`\
  \ com tolerância de 1e-14;\n  - B1 e os folds iguais a `pcal_ml_oof.csv`;\n  - sha256\
  \ das políticas iguais aos de `arranjo_corte_metadata.json`;\n  - desfechos de S3\
  \ reproduzidos.\n  - Se P divergir sem A3, rodar todas as réplicas com `include_a3=True`.\n\
  - **Não alterar:** `ml_oof.py`, `arranjo_corte.py` e `prereg_arranjo_corte.yaml`.\
  \ O pré-registro novo fixa o sha256 deles e de s1_metadata, taxas_crossfit, metricas\
  \ e par2.\n- **`tests/test_arranjo_robustez.py`:**\n  1. a factory só altera random_state\
  \ e n_jobs;\n  2. o fold_seed muda os splits e o xgb_seed não;\n  3. R0 sintético\
  \ é bit a bit igual ao resultado padrão;\n  4. as taxas com folds novos excluem\
  \ o próprio fold;\n  5. no bloco N, as taxas ficam iguais às congeladas;\n  6. tabela-verdade\
  \ de `dominates`;\n  7. regra de parada nos limites;\n  8. a fase A não produz coluna\
  \ derivada de rótulo nem faz chamada à API;\n  9. respostas novas não alteram as\
  \ taxas;\n  10. a retomada rejeita identidade divergente.\n- **Documentação e saídas:**\n\
  \  - `gzcmd/M_robustez_arranjo.md`;\n  - `gzcmd/prereg_robustez_arranjo.yaml`, com\
  \ `confirmatory: false`, `principal_arm_unchanged: P` e o pré-registro pai `d526c3f`/sha256;\n\
  \  - `data/robustez_arranjo_{acoes,replicas,diferencas,resumo}.csv` e `robustez_arranjo_metadata.json`;\n\
  \  - `text/latex/tables/tab_cap8_robustez_arranjo.tex`.\n\n## (k) Relato na tese\n\
  Modelos de redação para os três cenários (estável, não sustentada, mista), com P\
  \ sempre como braço principal. Os números saem só do CSV.\n"
