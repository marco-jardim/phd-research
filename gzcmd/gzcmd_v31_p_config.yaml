# Gerado por scripts/config_p_documental.py; perfil documental v3.1/P.
# O YAML original gzcmd_v3_config.yaml é congelado e deve permanecer intacto.
# Os runs históricos usaram aquele arquivo, não este snapshot posterior.
# Não basta carregar este YAML: executar o protocolo S1/S2/S3 de M_arranjo_corte.md.
# calibration abaixo descreve a inicialização/base; P substitui as probabilidades
# por recalibração abaixo do corte e as taxas por estimativas cross-fitted.
# anchors são alternativas históricas inativas em P, não a calibração de P.
# consistency / conflict_margin_delta: RESERVADO, NÃO IMPLEMENTADO.
# Não há restrição N:1 nem encaminhamento automático por margem de conflito.
# Parâmetros LLM documentam o experimento; este arquivo não faz chamadas.
version: 3
run:
  window:
    cadence: weekly
    lookback_days: 28
  modes:
  - name: vigilancia
    description: Prioriza recall (sensibilidade) para recuperar o máximo de óbitos.
  - name: confirmacao
    description: Prioriza precision (alta confiança) para listas muito confiáveis.
features:
  expected_columns:
  - nota_final
  - step
  - nome_score_total
  - mae_score_total
  - dtnasc_score_total
  - endereco_score_total
  - municipio_score
  - nome_x_dtnasc
  - nome_x_mae
  - mae_presente
  - dtnasc_perfeito
  - nome_perfeito
  missingness_flags:
  - nome_missing
  - mae_missing
  - dtnasc_missing
  - endereco_missing
bands:
  definitions:
    low:
      min: 0.0
      max: 5.0
      inclusive_max: false
    grey_low:
      min: 5.0
      max: 6.0
      inclusive_max: false
    grey_mid:
      min: 6.0
      max: 7.0
      inclusive_max: false
    grey_high:
      min: 7.0
      max: 8.0
      inclusive_max: false
    near_high:
      min: 8.0
      max: 9.0
      inclusive_max: false
    high:
      min: 9.0
      max: 999.0
      inclusive_max: true
anchors:
  pos_anchor:
    rule: nota_final >= 9.0
    target_mean_probability: 0.979
    min_count: 50
  neg_anchor:
    rule: nota_final < 5.0
    target_mean_probability: 0.0001
    min_count: 200
base_model:
  type: random_forest
  artifact_path: null
  proba_column: p_base
  score_space: probability
calibration:
  p_cal: ml_xgb
  method: anchor_platt
  by_band: true
  clip_min: 1.0e-06
  clip_max: 0.999999
  platt:
    l2: 0.001
    max_iter: 100
    tol: 1.0e-10
  safeguards:
    clip_p_base:
      min: 1.0e-06
      max: 0.999999
    clip_p_cal:
      min: 1.0e-06
      max: 0.999999
    max_abs_delta_a_per_window: 0.5
    max_abs_delta_b_per_window: 0.5
  output_column: p_cal
guardrails:
  policy_version: v3.1
  params:
    temporal_days: 180
    nota_always_match: 9.0
    nota_always_nonmatch: 5.0
    homonimia_min_nota: 7.0
    homonimia_year_gap: 5.0
  always_match:
  - nota_final >= 9 and p_cal_ml >= 0.9
  always_nonmatch:
  - nota_final < 5.0
  risky_if:
  - name: grey_mother_missing
    when: band in ['grey_low','grey_mid','grey_high'] and mae_missing == 1
    action: LLM_REVIEW
  - name: low_name_and_low_dob
    when: nome_score_total < 0.25 and dtnasc_score_total < 0.25
    action: NONMATCH
decision_policy:
  modes:
    vigilancia:
      costs:
        false_positive: 10.0
        false_negative: 50.0
        llm_review: 0.005
        human_review: 1.0
      human_error:
        e_fp: 0.05
        e_fn: 0.05
      human_budget:
        max_pairs_per_window: null
      auto:
        min_auto_match_threshold: 0.85
        max_auto_nonmatch_threshold: 0.15
      llm_budget:
        max_calls_per_window: 2000
        selection_metric: evr
    confirmacao:
      policy_kind: cost
      np:
        max_fp_rate_auto: 0.002
        max_fp_expected_total: null
        max_fn_rate_auto: 0.02
      costs:
        false_positive: 100.0
        false_negative: 20.0
        llm_review: 0.005
        human_review: 1.0
      human_error:
        e_fp: 0.05
        e_fn: 0.05
      human_budget:
        max_pairs_per_window: null
      auto:
        min_auto_match_threshold: 0.95
        max_auto_nonmatch_threshold: 0.1
      llm_budget:
        max_calls_per_window: 1000
        selection_metric: evr
llm_review:
  enabled: true
  protocol: dual_agent_plus_arbiter
  model:
    agent_a:
      name: claude-haiku-5-5
      max_tokens: 2500
    agent_b:
      name: claude-haiku-5-5
      max_tokens: 2500
    arbiter:
      name: claude-haiku-5-5
      max_tokens: 2500
  dossier:
    schema_version: gzcmd_v3.dossier.1.0
    include_shap: true
    include_safe_tokens: true
    secure_record_view:
      enabled: false
      pii_redaction: strict
      pii_leak_guard: true
  output:
    schema_path: schemas/gzcmd_v3_llm_output.schema.json
    must_return_json_only: true
  reliability:
    estimated_rates_path: error_rates_by_band_v4.yaml
    error_rates_by_band:
      grey_low:
        e_fp: 0.08
        e_fn: 0.12
      grey_mid:
        e_fp: 0.06
        e_fn: 0.1
      grey_high:
        e_fp: 0.04
        e_fn: 0.08
      near_high:
        e_fp: 0.02
        e_fn: 0.06
      low:
        e_fp: 0.1
        e_fn: 0.15
      high:
        e_fp: 0.01
        e_fn: 0.03
consistency:
  enabled: true
  strategy: top1_per_left_then_top1_per_right
  conflict_margin_delta: 0.03
monitoring:
  drift:
    enabled: true
    metrics:
      psi:
        threshold_warn: 0.15
        threshold_critical: 0.25
      ks:
        threshold_warn: 0.1
        threshold_critical: 0.2
    slices:
    - band
    - step
    monitored_fields:
    - nota_final
    - p_base
    - p_cal
    - nome_score_total
    - mae_score_total
    - dtnasc_score_total
    - endereco_score_total
    - municipio_score
    - mae_missing
  actions_on_critical_drift:
  - tighten_auto_thresholds
  - increase_llm_budget_if_possible
  - emit_alert
  - freeze_calibration
logging:
  level: INFO
  audit_log_path: runs/audit/
  store_dossiers: true
  store_llm_traces: true
  redact_logs: true
evaluation:
  test_size: 0.3
  seeds:
  - 42
  split_by: refrec
  group_stratify: true
arranjo_P_protocolo:
  consumido_pelo_runner_generico: false
  entrypoint: scripts/arranjo_corte_s1_simular.py
  seed: 42
  outer_folds: 5
  inner_folds: 5
  group: REFREC
  classifier_n_jobs: 8
  calibration_scope: treino abaixo do corte
  calibration: isotonica; Platt quando menos de 10 PAR=2
  reviewer_rates: cross-fitted; seis coortes Haiku v4 congeladas
  prompt: gzcmd_v4_llm_prompt.md
  dossier: sem model_outputs
  historical_config: gzcmd_v3_config.yaml
