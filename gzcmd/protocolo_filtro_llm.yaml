analysis: exploratory_post_hoc
registered: internal
date: '2026-11-05'
api_calls_allowed: false
thesis_changes: false
queue:
  source: data/pcal_ml_oof.csv
  population: abaixo do corte OpenRecLink, SCORE < corte do passo
  order: p_cal_ml OOF decrescente, pair_id lexicográfico crescente no desempate
  reference: scripts/comparador_mesma_carga.py
modes:
- vigilancia
- confirmacao
k:
- 17
- 29
- 58
- 96
- 121
- 125
- 440
filter:
  NONMATCH: descarte
  MATCH: humano
  UNSURE: humano
response_identity:
  model: Claude Haiku 5.5
  prompt_version: v4
  removed_fields:
  - model_outputs
  validate: modo, pair_id, modelo, prompt_sha256 e dossier_sha256 reconstruído e auditado
  frozen_sources: as três coortes por modo em error_rates_by_band_v4.yaml, validadas
    por cohort_sources/validated_responses de S1
  extra_sources:
  - anthropic_sem_mo_v4_arranjo_corte
  - anthropic_sem_mo_v4_arranjo_corte_supl
  - anthropic_sem_mo_v4_arranjo_robustez
  choice: Preferir coortes congeladas; entre elas usar exatamente a resposta carregada
    pelo braço P (validated_responses). Fora delas, S2 antes de suplemento antes de
    robustez; última ocorrência válida no mesmo arquivo.
  conflicts: Contar pares por modo com decisões válidas divergentes entre fontes;
    também contar no top-k.
coverage:
  phase: sem usar rótulos PAR; medir e persistir antes de carregar rótulos para desfechos
  complete_required: true
  stop: Não calcular desfechos de modo/k incompleto; para k <= 125 registrar pendências
    privadas, custo e ESCALATE. Outros modo/k completos seguem. k=440 incompleto apenas
    informa cobertura.
  missing_pair_cost_usd_no_cache: 0.00316
  cost_reference: gzcmd/llm_usage_cost.py
outcomes:
  H: k - NONMATCH
  par2_recovered: PAR=2 no top-k menos PAR=2 descartados por NONMATCH
  par2_discarded: PAR=2 descartados por NONMATCH
  nonlinks_discarded: PAR=0 descartados por NONMATCH
  vpn_nonmatch: não vínculos descartados / NONMATCH; IC de Wilson bilateral 95%; indefinido
    se denominador zero
  comparator: PAR=2 da fila O3 sem filtro com k=H em data/comparador_mesma_carga_curva.csv;
    H=0 implica zero recuperados
  difference: par2_recovered - comparator_par2_recovered
  human_perfect: (211 + PAR2_recuperados)/247
  human_error_05: (211 + 0.95 * PAR2_recuperados)/247; mesma fórmula para o comparador;
    cenário de sensibilidade, não taxa observada de erro nem hipótese de falsos positivos
interpretation:
  ajuda: Em todos os k avaliados no modo, diferença >= 0 e em pelo menos um k diferença
    > 0
  prejudica: Pior em algum k e não melhor em nenhum
  misto: Demais casos, incluindo igualdade em todos os k
  unavailable: Nenhum k completo no modo; sem classificação
limitations:
- Respostas do LLM também alimentaram as taxas do revisor e o braço P; análise não
  independente, exploratória e post hoc.
- Rótulos PAR=2 são oriundos da revisão do serviço; não se trata de validação independente.
- Apenas modo/k com cobertura completa são avaliados; classificação é restrita aos
  k avaliados.
outputs:
- data/filtro_llm_cobertura.csv
- data/filtro_llm.csv
- data/filtro_llm_metadata.json
privacy: Apenas agregados versionados; pair_id pendentes ficam somente em .local/filtro_llm.
